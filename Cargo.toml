[workspace]
members = ["crates/ducklake", "crates/ducklake-macros", "ducklake-python"]
resolver = "2"

[workspace.dependencies]
arrow-arith = "59.0"
arrow-array = "59.0"
arrow-schema = "59.0"
async-recursion = "1.1"
chrono = "0.4"
futures = "0.3"
heck = "0.5"
hex = "0.4"
indexmap = "2.14"
itertools = "0.15"
object_store = "0.13"
parquet = "59.0"
percent-encoding = "2.3"
proc-macro2 = "1.0"
pyo3 = "0.28"
pyo3-arrow = { version = "0.18", default-features = false }
quote = "1.0"
regex = "1.12"
rstest = "0.26"
rust_decimal = "1.42"
sea-query = "1.0"
sea-query-sqlx = "0.9"
serde = "1.0"
serde_json = "1.0"
sqlx = "0.9"
strum = "0.28"
syn = "2.0"
thiserror = "2.0"
tokio = "1.50"
url = "2.5"
uuid = "1.23"

ducklake = { path = "crates/ducklake", version = "0.0.0" }
ducklake-macros = { path = "crates/ducklake-macros", version = "0.0.0" }

# FIXME: Temporarily override arrow-rs with fork until https://github.com/apache/arrow-rs/pull/10514 is released
[patch.crates-io]
arrow-arith = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-array = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-buffer = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-cast = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-ord = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-schema = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
arrow-select = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }
parquet = { git = "https://github.com/borchero/arrow-rs", rev = "cd0d163f047812fc6e450c8503a4cf6328cdc252" }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
unreachable_pub = "deny"
