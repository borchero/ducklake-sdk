output: [summary]
no_auto_install: true
pre-commit:
  fail_on_changes: always
  exclude:
    - "**/*.sqlite"
    - "tests/_snapshots/*/*.sql"
  jobs:
    - name: pixi-install
      run: pixi install
    - group:
        parallel: true
        jobs:
          # --------------------------------------- PYTHON -------------------------------------- #
          - name: ruff-lint
            glob: "*.{py,pyi}"
            run: pixi run ruff check --fix --exit-non-zero-on-fix --force-exclude
          - name: ruff-format
            glob: "*.{py,pyi}"
            run: pixi run ruff format --force-exclude
          - name: ty
            glob: "*.{py,pyi}"
            run: pixi run ty check
          # ---------------------------------------- RUST --------------------------------------- #
          - name: cargo-fmt
            glob: "*.rs"
            run: cargo fmt
          - group:
              parallel: false
              jobs:
                - name: cargo-clippy-fix
                  glob: "*.rs"
                  run: cargo clippy --fix --allow-dirty
                - name: cargo-clippy-check
                  glob: "*.rs"
                  run: cargo clippy -- -D warnings
          # ---------------------------------------- MISC --------------------------------------- #
          - name: rumdl
            glob: "*.md"
            run: pixi {run} rumdl check --fix {staged_files}
          - name: yamlfmt
            glob: "*.{yml,yaml}"
            run: pixi {run} yamlfmt {staged_files}
          - name: tombi
            glob: "*.toml"
            run: pixi {run} tombi format --offline {staged_files}
          - name: trailing-whitespace-fixer
            glob: "*"
            run: pixi run trailing-whitespace-fixer {staged_files}
          - name: end-of-file-fixer
            glob: "*"
            run: pixi run end-of-file-fixer {staged_files}
          - name: check-merge-conflict
            glob: "*"
            run: pixi run check-merge-conflict {staged_files}
          - name: typos
            glob: "*"
            run: pixi run typos --force-exclude {staged_files}
